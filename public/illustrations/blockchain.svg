<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#f9fafb"/>
  
  <!-- Blockchain/Chain visualization -->
  <g id="blockchain">
    <!-- Chain links -->
    <rect x="80" y="100" width="60" height="60" rx="8" fill="url(#grad1)" opacity="0.9"/>
    <rect x="170" y="100" width="60" height="60" rx="8" fill="url(#grad2)" opacity="0.8"/>
    <rect x="260" y="100" width="60" height="60" rx="8" fill="url(#grad1)" opacity="0.7"/>
    
    <!-- Chain connectors -->
    <line x1="140" y1="130" x2="170" y2="130" stroke="url(#grad1)" stroke-width="3"/>
    <line x1="230" y1="130" x2="260" y2="130" stroke="url(#grad2)" stroke-width="3"/>
    
    <!-- Chain nodes -->
    <circle cx="110" cy="130" r="4" fill="#ffffff"/>
    <circle cx="200" cy="130" r="4" fill="#ffffff"/>
    <circle cx="290" cy="130" r="4" fill="#ffffff"/>
    
    <!-- Lower blocks -->
    <rect x="60" y="220" width="80" height="80" rx="10" fill="url(#grad2)" opacity="0.85"/>
    <rect x="180" y="220" width="80" height="80" rx="10" fill="url(#grad1)" opacity="0.85"/>
    <rect x="300" y="220" width="80" height="80" rx="10" fill="url(#grad2)" opacity="0.75"/>
    
    <!-- Vertical connectors -->
    <line x1="100" y1="160" x2="100" y2="220" stroke="url(#grad1)" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="220" y1="160" x2="220" y2="220" stroke="url(#grad2)" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="340" y1="160" x2="340" y2="220" stroke="url(#grad1)" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Decorative elements -->
    <circle cx="100" cy="260" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="220" cy="260" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="340" cy="260" r="6" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
